schema_version: 2

autocompaction_policy:
  minimum_tokens: 100000
  increment_tokens: 100000
  maximum_tokens: 1000000
  calculation: >-
    min(1000000, floor(context_window_tokens / 100000) * 100000)
  applicability: >-
    Apply only to standalone Claude Code session models with a context
    window of at least 100000 tokens.
  runtime_note: >-
    The live server must be configured to provide at least the selected
    autocompaction value. If the runtime context is lower, lower the
    catalogue context and recalculate before starting Claude Code.

