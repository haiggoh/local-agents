schema_version: 2
reviewed_at: "2026-09-05"
purpose: >-
  Reviewed context-window and Claude Code autocompaction metadata for every
  artifact listed in the three new acquisition PSV catalogues.

placement:
  repository: local-agents
  required_path: config/model-catalogue-context-additions.yaml
  sibling_download_catalogues:
    - config/model-catalog.acquisitions.rapid.psv
    - config/model-catalog.acquisitions.omlx.psv
    - config/model-catalog.acquisitions.gguf.psv
  existing_context_catalogue: config/model-catalogue-context-list.yaml
  instruction: >-
    Keep this reviewed input under config with the PSV catalogues it references.
    During Work package 0, inspect the live existing context catalogue and propose
    a deterministic merge or canonical successor. Do not maintain two independent
    runtime truths and do not overwrite the existing catalogue without approval.
    After acquisition, reconcile each record against the pinned local artifact and
    write final evidence to ~/.models/<directory>/.local-model-manifest.json.

autocompaction_policy:
  minimum_tokens: 100000
  increment_tokens: 100000
  maximum_tokens: 1000000
  calculation: >-
    min(1000000, floor(effective_context_tokens / 100000) * 100000)
  effective_context_rule: >-
    effective context is the minimum of the selected mode, exact artifact
    configuration, backend capability, explicit server allocation, and any
    enforced tested-safe cap

