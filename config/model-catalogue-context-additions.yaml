validation_requirements:
  - Resolve every psv_alias uniquely across all loaded PSV catalogues.
  - Verify every selected repository revision and payload size before download.
  - Inspect exact local config.json or GGUF metadata after acquisition.
  - Retain credible conflicts and record the reviewed resolution.
  - Do not let tokenizer sentinels or processor limits override text context.
  - Require server context to be at least the selected autocompaction value.
  - Recompute autocompaction whenever effective context changes.
  - Do not assign independent context to processor or sidecar records.
